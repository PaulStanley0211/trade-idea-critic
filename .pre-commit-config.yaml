# Pre-commit hooks for Trade-Idea Critic.
# Install: `pip install pre-commit && pre-commit install` (or `uv tool install pre-commit`).
# Run on all files: `pre-commit run --all-files`.

default_language_version:
  python: python3.11

repos:
  # Basic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python: ruff (lint + format) — replaces black + isort + flake8.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend formatting: Prettier.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$

  # Local hooks — run via system tools.
  - repo: local
    hooks:
      # CLAUDE.md rule: no Unicode emoji anywhere in source.
      # Pattern covers the common emoji blocks; functional Unicode
      # (arrows, plus/minus, box-drawing) is permitted.
      - id: no-emoji
        name: No Unicode emoji
        entry: "[\U0001F300-\U0001FAFF\U0001F600-\U0001F64F\U0001F680-\U0001F6FF\U0001F900-\U0001F9FF\U0001FA00-\U0001FAFF\U0001F000-\U0001F02F\U0001F100-\U0001F1FF\U0001F200-\U0001F2FF]"
        language: pygrep
        types: [text]
        exclude: ^(\.pre-commit-config\.yaml|docs/review-prompt\.md)$

      # Mypy via uv, scoped to backend. Slow — skip with `git commit --no-verify`
      # is forbidden; if mypy is failing, fix the issue.
      - id: mypy
        name: mypy (backend/app)
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/

      # ESLint via npm, scoped to frontend.
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint --silent --
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
