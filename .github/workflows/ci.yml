name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: critic
          POSTGRES_PASSWORD: critic
          POSTGRES_DB: critic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U critic -d critic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://critic:critic@localhost:5432/critic
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: dummy-not-used-cassettes-replay-only
      EDGAR_USER_AGENT: ci ci@example.com
      NEWSAPI_KEY: dummy
      MAX_DAILY_LLM_COST_USD: "10.00"
      LOG_LEVEL: WARNING
      ENVIRONMENT: ci
      LLM_CACHE_DIR: ./.llm_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python deps
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check app tests
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Alembic migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Pytest (unit)
        working-directory: backend
        run: uv run pytest tests/unit -q --cov=app --cov-report=xml --cov-fail-under=80
      - name: Pytest (integration, cassette-replay only)
        working-directory: backend
        env:
          REC: "0"
        run: uv run pytest tests/integration -q

  frontend:
    name: Frontend (lint + type + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test -- --run

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          uv pip compile pyproject.toml -o /tmp/reqs.txt --quiet
          uv run --with pip-audit pip-audit -r /tmp/reqs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend, prod deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
